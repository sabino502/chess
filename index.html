LR={w,why};const by={'Xeque-mate':'por xeque-mate','Tempo esgotado':'por tempo','Desistência':'por desistência','Afogamento':'por afogamento','Material insuficiente':'por material insuficiente'}[why];
const sub={'Xeque-mate':`${nm(turn)} levou xeque-mate`,'Tempo esgotado':`O tempo de ${nm(turn)} acabou`,'Desistência':`${nm(turn)} desistiu da partida`,'Afogamento':'Sem lances legais e sem xeque','Material insuficiente':'Nenhum lado consegue dar xeque-mate'}[why];
const ico=w?`<svg class="ic" viewBox="0 0 64 64"><path d="M18 8h28v16c0 9-6 16-14 16S18 33 18 24zM18 12H8c0 9 4 15 12 16M46 12h10c0 9-4 15-12 16M28 40h8v8h-8zM20 56h24v-8H20z" fill="#ffc83d" stroke="#9a6b00" stroke-width="2.5" stroke-linejoin="round"/></svg>`:`<svg class="ic" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#8a8883" stroke="#bdbbb5" stroke-width="3"/><path d="M20 28h24M20 38h24" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>`;
const row=c=>`<div class="pr2${w==c?' win':''}"><div class="av">${pc('k',c)}</div><div class="pi"><b>${nm(c)}</b><small>${c=='w'?'Brancas':'Pretas'} · ${fmt(T[c])}</small></div>${w==c?'<svg width="30" height="30" viewBox="0 0 24 24"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z" fill="#ffc83d" stroke="#9a6b00" stroke-width="1.4" stroke-linejoin="round"/></svg>':''}</div>`;
return `<div class="cd${w?'':' dr'}"><div class="hd">${ico}<h2>${w?nm(w)+' venceu':'Empate'}</h2><div class="why">${by}</div></div><div class="bd2"><div class="sc">${w=='w'?'1 – 0':w=='b'?'0 – 1':'½ – ½'}</div>${row('w')}${row('b')}<p class="sub">${sub}</p><button class="bt" id="again">Jogar de novo</button></div></div>`}
function showEnd(){let e=$('#end');if(!e){e=document.createElement('div');e.id='end';document.body.appendChild(e)}e.className='';e.innerHTML=endCard2();saveGame();$('#again').onclick=()=>{e.remove();setup()}}
let SV=0,mc=0,HM=null,LR={};
function hget(){if(!HM){try{HM=JSON.parse(localStorage.getItem('xh')||'[]')}catch(e){HM=[]}}return HM}
function hset(a){HM=a.slice(0,100);try{localStorage.setItem('xh',JSON.stringify(HM))}catch(e){}}
function saveGame(){if(SV)return;SV=1;hset([{t:Date.now(),w:names.w,b:names.b,r:LR.w||'d',why:LR.why,tc:(tc[0]/60)+' min'+(tc[1]?' +'+tc[1]+'s':''),m:mc},...hget()])}
function showHist(){let e=$('#hist');if(e){e.remove();return}e=document.createElement('div');e.id='hist';const H=hget();
const it=g=>{const d=new Date(g.t),dt=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});return `<div class="hi"><div class="rs ${g.r}">${g.r=='w'?'1–0':g.r=='b'?'0–1':'½–½'}</div><div class="hn"><b><i class="tk" style="background:#fff"></i>${g.w} <span>vs</span> <i class="tk" style="background:#111"></i>${g.b}</b><small>${g.r=='d'?'Empate':(g.r=='w'?g.w:g.b)+' venceu'} · ${g.why} · ${g.m} lances</small><small>${g.tc} · ${dt}</small></div></div>`};
e.innerHTML=`<div class="cd hc"><div class="hh"><b>Histórico de partidas</b><button id="hx">✕</button></div><div class="hl">${H.length?H.map(it).join(''):'<p class="sub" style="padding:20px">Nenhuma partida ainda.</p>'}</div>${H.length?'<button class="bt s" id="hclr">Limpar histórico</button>':''}</div>`;
document.body.appendChild(e);$('#hx').onclick=()=>e.remove();e.onclick=ev=>{if(ev.target==e)e.remove()};const c=$('#hclr');if(c)c.onclick=()=>{hset([]);e.remove();showHist()}}
function setup(){const E=$('#end');if(E)E.remove();names.w='Brancas';names.b='Pretas';init();paused=1;const o=$('#ov');o.className='';
const ch=[[60,1,'1 min','Bullet','+1s/lance'],[300,0,'5 min','Blitz',''],[600,0,'10 min','Rápida','']];
o.innerHTML=`<h2>Nova partida</h2><input id="n1" maxlength="14" placeholder="Nome das Brancas (obrigatório)" value="${names.w=='Brancas'?'':names.w}"><input id="n2" maxlength="14" placeholder="Nome das Pretas (obrigatório)" value="${names.b=='Pretas'?'':names.b}"><div class="tc">${ch.map(c=>`<button data-s="${c[0]}" data-n="${c[1]}" class="${tc[0]==c[0]?'on':''}"><b>${c[2]}</b><small>${c[3]}${c[4]?'<br>'+c[4]:''}</small></button>`).join('')}</div><button class="bt" id="go">Começar</button>`;
o.querySelectorAll('.tc button').forEach(x=>x.onclick=()=>{tc=[+x.dataset.s,+x.dataset.n];o.querySelectorAll('.tc button').forEach(y=>y.classList.toggle('on',y==x))});
$('#go').onclick=()=>{const a=esc($('#n1').value),c=esc($('#n2').value);['#n1','#n2'].forEach((s,i)=>{const x=$(s);x.classList.remove('bad');if(!(i?c:a)){void x.offsetWidth;x.classList.add('bad')}});if(!a||!c){$(a?'#n2':'#n1').focus();return}names.w=a;names.b=c;T.w=T.b=tc[0]*1000;inc=tc[1]*1000;paused=0;lastT=performance.now();ac();sfx('start');render()}}
setInterval(()=>{const n=performance.now(),d=Math.min(n-lastT,500);lastT=n;
if(!over&&rolled&&!rolling&&!pend&&!paused){T[turn]-=d;const s=Math.ceil(T[turn]/1000);if(T[turn]<=0){T[turn]=0;over=1;res=`Tempo esgotado! ${nm(opp(turn))} venceu`;sfx('end');render()}else if(T[turn]<10000&&s!=lastS){lastS=s;sfx('tick')}}bars()},100);
function slide(a,z){const el=$(`#bd [data-i="${z}"] svg`);if(!el)return;const p=i=>[flip?7-fl(i):fl(i),flip?7-rk(i):rk(i)],[x1,y1]=p(a),[x2,y2]=p(z),s=$('#bd').clientWidth/8;
el.animate([{transform:`translate(${(x1-x2)*s}px,${(y1-y2)*s}px) scale(1.12)`,zIndex:30},{transform:'none',zIndex:30}],{duration:260,easing:'cubic-bezier(.25,.8,.3,1)'})}
function doAnim(){const a=anim;anim=null;if(spin){spin=0;const bd=$('#bd');bd.classList.remove('sp');void bd.offsetWidth;bd.classList.add('sp');setTimeout(()=>bd.classList.remove('sp'),900);return}if(!a)return;if(skipAnim){skipAnim=0;return}slide(a.from,a.to);if(a.fg=='ck')slide(a.from+3,a.from+1);if(a.fg=='cq')slide(a.from-4,a.from-1)}
const sqAt=(x,y)=>{const r=$('#bd').getBoundingClientRect(),df=Math.floor((x-r.left)/r.width*8),dr=Math.floor((y-r.top)/r.height*8);return df<0||df>7||dr<0||dr>7?-1:(flip?7-dr:dr)*8+(flip?7-df:df)};
function hv(t){document.querySelectorAll('#bd .hov').forEach(x=>x.classList.remove('hov'));const c=$(`#bd [data-i="${t}"]`);if(c&&lt.some(m=>m.to==t))c.classList.add('hov')}
$('#bd').onpointerdown=e=>{if(over||!rolled||rolling||pend)return;const i=sqAt(e.clientX,e.clientY);if(i<0)return;const p=b[i];
if(p&&p.c==turn){if(sel!=i){sel=i;lt=legal(i);render()}drag={i,x:e.clientX,y:e.clientY,on:0};$('#bd').setPointerCapture(e.pointerId)}else tap(i)};
$('#bd').onpointermove=e=>{if(!drag)return;
if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){drag.on=1;const s=$('#bd').clientWidth/8*1.25,g=document.createElement('div');g.className='ghost';g.style.width=g.style.height=s+'px';g.innerHTML=pc(b[drag.i].t,b[drag.i].c);document.body.appendChild(g);drag.g=g;drag.s=s;const o=$(`#bd [data-i="${drag.i}"] svg`);if(o)o.style.opacity=.3}
if(drag.on){drag.g.style.left=e.clientX-drag.s/2+'px';drag.g.style.top=e.clientY-drag.s*.75+'px';hv(sqAt(e.clientX,e.clientY-drag.s*.25))}};
$('#bd').onpointerup=e=>{if(!drag)return;const d=drag;drag=null;if(d.g)d.g.remove();
if(d.on){const t=sqAt(e.clientX,e.clientY-d.s*.25),m=lt.find(m=>m.to==t);
if(m){if(b[m.from].t=='p'&&(rk(m.to)==0||rk(m.to)==7)){pend=m;render()}else{skipAnim=1;fin(m)}}else render()}};
$('#bd').onpointercancel=()=>{if(drag){if(drag.g)drag.g.remove();drag=null;render()}};
$('#nw').onclick=setup;$('#sn').onclick=()=>{mute^=1;$('#st').textContent=mute?'Mudo':'Som';$('#sn').style.opacity=mute?.45:1};$('#hb').onclick=showHist;
let rsT=0;$('#rs').onclick=()=>{if(over||paused||rolling)return;const bt=$('#rt');if(!rsT){bt.textContent='Confirmar?';rsT=setTimeout(()=>{rsT=0;bt.textContent='Desistir'},3000);return}clearTimeout(rsT);rsT=0;bt.textContent='Desistir';res=`Desistência! ${nm(opp(turn))} venceu`;over=1;sfx('end');render()};;
let FW=0,FH=0;function fit(){const w=innerWidth,h=innerHeight;if(w!=FW){FW=w;FH=h}else if(h>FH)FH=h;document.documentElement.style.setProperty('--s',Math.min(w-16,FH-335)+'px')}
fit();addEventListener('resize',fit);
setup();
</script></body></html>
